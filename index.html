<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lino Ling - Portafolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Partículas Dinámicas de Fondo -->
    <canvas id="network-canvas"></canvas>

    <!-- Zona oculta para habilitar edición -->
    <div id="secret-trigger" class="secret-trigger" title=""></div>
    
    <header class="glass-header">
        <div class="container">
            <div class="brand">
                <h1 class="glitch-text" data-text="Portafolio, Lino Ling">Portafolio, Lino Ling</h1>
                <span class="subtitle">LazyEngineer</span>
            </div>
            <nav>
                <ul>
                    <li><a href="#sobre-mi">Sobre Mí</a></li>
                    <li><a href="#proyectos">Proyectos</a></li>
                    <li class="admin-only"><a href="#agregar">Administrar</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section id="inicio" class="hero">
            <div class="container">
                <div class="greeting-wrapper">
                    <p class="greeting typing">&gt; Hola Mundo _</p>
                </div>
                <h2 class="reveal">Construyendo soluciones eficientes con el mínimo esfuerzo necesario.</h2>
            </div>
        </section>

        <!-- Nueva Sección Dinámica Sobre Mí -->
        <section id="sobre-mi" class="about-section">
            <div class="container reveal">
                <h2 class="section-title">/ Sobre Mí</h2>
                
                <div class="terminal-window" id="terminal-view">
                    <div class="terminal-header">
                        <div class="terminal-buttons">
                            <span class="close-btn"></span>
                            <span class="min-btn"></span>
                            <span class="max-btn"></span>
                        </div>
                        <div class="terminal-title">user@senati: ~</div>
                    </div>
                    <div class="terminal-body" id="terminal-body">
                        <!-- El texto se escribirá dinámicamente aquí usando JS -->
                    </div>
                </div>
                
            </div>
        </section>

        <section id="proyectos" class="projects-section">
            <div class="container">
                <h2 class="section-title reveal">/ Mis Proyectos</h2>
                <div class="projects-grid" id="projects-grid">
                    <!-- Los proyectos se insertarán aquí dinámicamente con JavaScript -->
                </div>
            </div>
        </section>

        <section id="agregar" class="add-project-section admin-only reveal">
            <div class="container">
                <h2 class="section-title">/ Nuevo Proyecto</h2>
                <form id="add-project-form" class="glass-form">
                    <div class="form-group">
                        <label for="project-title">Título:</label>
                        <input type="text" id="project-title" required>
                    </div>
                    <div class="form-group">
                        <label for="project-desc">Descripción:</label>
                        <textarea id="project-desc" rows="4" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="project-url">URL (Opcional):</label>
                        <input type="url" id="project-url">
                    </div>
                    <div class="form-group">
                        <label for="project-tech">Tecnologías (comas):</label>
                        <input type="text" id="project-tech" placeholder="Ej: React, Node, Express" required>
                    </div>
                    <button type="submit" class="btn pulse-btn">Deploy &gt;_</button>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <div class="container reveal">
            <p>&copy; <span id="year"></span> Lino Ling. <span class="admin-indicator admin-only">[Modo Edición]</span></p>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
