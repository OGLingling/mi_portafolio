version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: lazyengineer
      POSTGRES_PASSWORD: amoprogramar
      POSTGRES_DB: portafolio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata:
